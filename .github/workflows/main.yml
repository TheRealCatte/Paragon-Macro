name: Continuous Build and Auto-Release

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ closed ]
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: win-macro-exe
            path_to_upload: dist/main.exe
          - os: ubuntu-latest
            artifact_name: linux-macro-deb
            path_to_upload: dist/*.deb

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller ruff pytest
        # Explicitly install common macro libraries if they aren't in requirements.txt
        pip install pyautogui pynput keyboard mouse selenium openpyxl optional-dependencies || true
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash

    # --- WINDOWS BUILD ---
    - name: Build Windows .exe
      if: matrix.os == 'windows-latest'
      # Force PowerShell to halt instantly if PyInstaller fails so you get a clear log
      shell: powershell
      run: |
        pyinstaller --onefile --noconsole main.py
        if (-not (Test-Path "dist/main.exe")) {
          Write-Error "PyInstaller failed to generate dist/main.exe!"
          exit 1
        }

    # --- LINUX BUILD ---
    - name: Install Debian Packaging Tools
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby ruby-dev rubygems build-essential
        sudo gem install --no-document fpm

    - name: Build Linux .deb package
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --onefile main.py
        mkdir -p dist
        fpm -s dir -t deb \
          -n "python-macro" \
          -v "1.0.0-dev" \
          -p dist/ \
          --prefix /usr/local/bin \
          dist/main
      shell: bash

    - name: Upload Temporary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.path_to_upload }}
        if-no-files-found: error # Forces the build stage to fail early if files are missing

  publish:
    name: Auto-Publish Rolling Release
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: win-macro-exe
        path: release-assets/

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: linux-macro-deb
        path: release-assets/

    - name: Publish or Update Rolling Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Latest Development Build"
        body: |
          This release contains the automated compilation of the most recent code changes.
          
          **Last Updated:** ${{ github.event.head_commit.timestamp || 'Just now' }}
          **Commit:** ${{ github.sha }}
        draft: false
        prerelease: true
        generate_release_notes: true
        files: |
          release-assets/main.exe
          release-assets/*.deb

name: build and release

on:
  push: 
    tags:
      - 'release'

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: win
            path_to_upload: dist/ParagonMacro.exe
          - os: ubuntu-latest
            artifact_name: linux
            path_to_upload: dist/ParagonMacro.deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@4v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ruff pytest
          pip install -r requirements.txt
        shell: bash

      # Windows Build
      - name: Build .exe
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          pyinstaller --onefile --noconsole main.py
          if (-not (Test-Path "dist/main.exe")) {
            Write-Error "PyInstaller failed to generate dist/main.exe!"
            exit 1
          }

      # Linux Build
      - name: Install Debian Tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm

      - name: Build .deb
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --onefile main.py
          mkdir -p dist
          fpm -s dir -t deb \
            -n "python-macro" \
            -v "1.0.0-dev" \
            -p dist/ \
            --prefix /usr/local/bin \
            dist/main
        shell: bash

      - name: Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.path_to_upload }}
          if-no-files-found: error
          
  publish:
    name: Publish Releases
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Win Artifact
        uses: actions/download-artifact@v4
        with:
          name: win
          path: release-assets/

      - name: Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: release-assets/

      - name: Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          overwrite: false
          append_body: true
          files: |
            release-assets/ParagonMacro.exe
            release-assets/ParagonMacro.deb
    

name: Build Cross-Platform Macro Assets

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    strategy:
      matrix:
        # Run the workflow on both Windows and Ubuntu Linux concurrently
        include:
          - os: windows-latest
            artifact_name: win-macro-exe
            path_to_upload: dist/main.exe
          - os: ubuntu-latest
            artifact_name: linux-macro-deb
            path_to_upload: dist/*.deb

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      # Use bash syntax for Linux, default to PowerShell for Windows automatically
      shell: bash

    # --- WINDOWS ONLY BUILD STEP ---
    - name: Build Windows .exe
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --noconsole main.py

    # --- LINUX ONLY BUILD STEP ---
    - name: Install Debian Packaging Tools
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby ruby-dev rubygems build-essential
        sudo gem install --no-document fpm

    - name: Build Linux .deb package
      if: matrix.os == 'ubuntu-latest'
      run: |
        # 1. Compile the Python script into a standalone Linux binary
        pyinstaller --onefile main.py
        
        # 2. Package that binary into a standardized .deb file using FPM
        mkdir -p dist
        fpm -s dir -t deb \
          -n "python-macro" \
          -v "1.0.0" \
          --prefix /usr/local/bin \
          dist/main
      shell: bash

    # --- UNIVERSAL UPLOAD STEP ---
    - name: Upload Generated Binary
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.path_to_upload }}
